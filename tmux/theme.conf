# ~/.dotfiles/.config/tmux/theme.conf
# solarized-osaka, the same palette Neovim loads.

set -g status-style "bg=#002c38,fg=#9eabac"

setw -g window-status-style "fg=#637981,bg=#002c38"
setw -g window-status-current-style "fg=#b28500,bg=#063540,bright"

set -g pane-border-style "fg=#063540"
set -g pane-active-border-style "fg=#29a298"

set -g message-style "bg=#063540,fg=#ffbf00"

set -g display-panes-active-colour "#268bd3"
set -g display-panes-colour "#b28500"
setw -g clock-mode-colour "#849900"
