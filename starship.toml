"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = """$directory$fill$git_branch$git_status$cmd_duration$package$nodejs$python$rust$golang$docker_context
$character"""
command_timeout = 10000

[fill]
symbol = ' '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold purple)'

[cmd_duration]
min_time = 2_000
format = '[ $duration]($style)'
style = 'bold purple'

[directory]
style = 'bold blue'
format = '[ $path]($style)[$read_only]($read_only_style)'
read_only_style = 'bold red'
read_only = ' '

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = 'bold cyan'
symbol = "\ue0a0 "

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'bold cyan'
conflicted = ' '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = ' '
stashed = ' '
modified = ' '
staged = ' '
renamed = '󰑕 '
deleted = ' '

[gcloud]
disabled = true

[nodejs]
format = '[ $symbol($version)]($style)'
symbol = ' '
style = 'green'

[python]
format = '[ $symbol$version]($style)'
symbol = ' '
style = 'purple'

[rust]
format = '[ $symbol($version)]($style)'
symbol = ' '
style = 'red'

[golang]
format = '[ $symbol($version)]($style)'
symbol = ' '
style = 'cyan'

[docker_context]
format = '[ $symbol$context]($style)'
symbol = ' '
style = 'blue'

[package]
format = '[ $symbol$version]($style)'
symbol = '󰏗 '
style = 'blue'
